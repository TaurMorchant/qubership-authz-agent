---
# Build workflow for qubership-authz-agent.
#
# Delegates to the shared Go build workflow in qubership-core-infra, which runs
# go test, SonarQube analysis, and Docker image builds.  The codecov job uploads
# the product module's coverage to Codecov.
#
# Module configuration note
# -------------------------
# This repository has five Go modules:
#   .                              — the product module (two binaries, zero external deps)
#   test/parity/suite              — parity-replay test suite
#   test/integration/testify       — runtime integration suite (needs a running stack)
#   test/integration/pipstub       — pip-stub service used by the integration suite
#   test/integration/tenantmanager — tenant-manager emulator the agent calls in the kind harness
#
# The shared workflow takes a single go-module-dir and would only build and test
# the product module.  The explicit go-module-configs list below makes all five
# modules visible so CI does not silently skip the test suites.
#
# The integration-tagged suites are not built here: without -tags integration
# the compiler leaves those files out, so this workflow covers the non-integration
# tests only.  integration-tests.yaml compiles the tagged suites and runs the
# runtime suite against the Helm chart on a kind cluster.

name: CI

run-name: >
  CI —
  ${{ github.event_name == 'push' && format('push [{0}]', github.event.head_commit.message) || '' }}
  ${{ github.event_name == 'pull_request' && format('PR ({0}) [{1}]', github.head_ref, github.event.pull_request.title) || '' }}

on:
  push:
    branches:
      - main
      - 'lts/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # The name of this job and of the workflow are kept to one word each: the
  # reusable workflows prepend their own job names, and the check ends up as
  # "CI / Go / Build Docker image / Build Docker Images (<component>, ...)".
  # Anything longer here pushes the component name out of view.
  build:
    name: Go
    # Explicit grant matching what generic-go-build.yaml declares for itself;
    # a caller without a permissions block would hand over the default token.
    permissions:
      contents: read
      pull-requests: write
      packages: write
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@ed95ad948025728db1e613a3e1a4e6a11186f541 # v2.6.2
    with:
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      # Explicit module list — see the comment at the top of this file for why
      # these entries exist rather than relying on auto-discovery.
      go-module-configs: |
        [
          {"dir": ".",                        "cover-packages": "./..."},
          {"dir": "test/parity/suite",        "cover-packages": "./..."},
          {"dir": "test/integration/testify", "cover-packages": "./..."},
          {"dir": "test/integration/pipstub", "cover-packages": "./..."},
          {"dir": "test/integration/tenantmanager", "cover-packages": "./..."}
        ]
    # The shared workflow declares exactly one secret; pass it explicitly
    # instead of `secrets: inherit` (zizmor: secrets-inherit).
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Runs the product module's tests and uploads their coverage to Codecov.  The
  # shared workflow uploads its coverage profiles as artifacts only when the
  # Sonar project key is set, and a pull request from a fork gets no repository
  # variables, so this job produces its own profile.  The modules under test/ are test suites
  # whose profiles cover only test code, so they are left out.
  #
  # Build gate does not wait for this job, so an upload that Codecov rejects
  # fails this job without blocking the merge.
  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The shared workflow runs the same command for the product module, so
      # Codecov and Sonar measure the same packages.  Keep -coverpkg equal to
      # the cover-packages of the "." entry in go-module-configs above.
      - name: Run the tests with coverage
        run: go test ./... -coverpkg=./... -coverprofile coverage.out
      # GitHub withholds secrets from a pull request opened from a fork, so the
      # token is empty there, and Codecov accepts a tokenless upload from a fork
      # of a public repository.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unit
          disable_search: true
          fail_ci_if_error: true

  build-gate:
    name: Build gate
    runs-on: ubuntu-latest
    permissions: {}
    needs: [build]
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Check build result
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = "success"
